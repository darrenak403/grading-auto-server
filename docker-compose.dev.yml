services:
  postgres:
    container_name: grading-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PUBLISH_PORT}:5432'
    volumes:
      - grading_postgres_data:/var/lib/postgresql/data
    networks:
      - grading_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sqlserver:
    container_name: grading-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - '${SQLSERVER_PUBLISH_PORT}:1433'
    volumes:
      - grading_sqlserver_data:/var/opt/mssql
    networks:
      - grading_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C -b",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  rabbitmq:
    container_name: grading-rabbitmq
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '${RABBITMQ_AMQP_PORT}:5672'
      - '${RABBITMQ_UI_PORT}:15672'
    volumes:
      - grading_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - grading_net
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pgweb:
    container_name: grading-pgweb
    profiles: [tools]
    image: sosedoff/pgweb:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
    ports:
      - '${PGWEB_PORT}:8081'
    networks:
      - grading_net
    restart: unless-stopped

volumes:
  grading_postgres_data:
    name: grading_postgres_data
  grading_sqlserver_data:
    name: grading_sqlserver_data
  grading_rabbitmq_data:
    name: grading_rabbitmq_data

networks:
  grading_net:
    name: grading_net
    driver: bridge
