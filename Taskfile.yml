# Dev local — https://taskfile.dev/installation/  |  BE.md

version: '3'

vars:
  COMPOSE: docker compose --env-file docker/.env.local -f docker/docker-compose.dev.yml
  COMPOSE_APP: '{{.COMPOSE}} --profile app'
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker

tasks:
  default:
    desc: Gợi ý lệnh dev
    silent: true
    cmds:
      - task --list
      - |
        echo ""
        echo "1. Tao docker/.env.local (xem docker/.env.example)"
        echo "2. task docker:up"
        echo "3. task run  +  task run:worker"
        echo "Doi code image: task docker:build"
        echo "Doc: BE.md"

  docker:build:
    desc: Build image API + Worker (chạy lại khi đổi code)
    deps: [_env:local]
    cmds:
      - mkdir -p storage
      - '{{.COMPOSE_APP}} build'

  docker:up:
    desc: Infra Docker — Postgres, SQL Server, RabbitMQ, pgWeb (không build)
    deps: [_env:local]
    cmds:
      - mkdir -p storage
      - '{{.COMPOSE}} up -d --no-build'
      - |
        echo ""
        echo "Postgres host port: xem POSTGRES_PUBLISH_PORT trong docker/.env.local"
        echo "pgWeb:  http://localhost:8081"
        echo "Rabbit: http://localhost:15672"
        echo "App:    task run + task run:worker  ->  http://localhost:5049/swagger"

  docker:down:
    desc: Tắt infra Docker
    deps: [_env:local]
    cmd: '{{.COMPOSE}} down'

  docker:logs:
    desc: Log infra Docker
    deps: [_env:local]
    cmd: '{{.COMPOSE}} logs -f --tail=100'

  run:
    desc: API local — :5049/swagger
    dir: '{{.API_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5049
      AWS__AccessKey: '{{.AWS_ACCESS_KEY}}'
      AWS__SecretKey: '{{.AWS_SECRET_KEY}}'
      AWS__Region: '{{.AWS_REGION | default "us-east-1"}}'
      AWS__BedrockModelId: '{{.AWS_BEDROCK_MODEL_ID | default "anthropic.claude-3-5-sonnet-20241022-v2:0"}}'
    cmd: dotnet run

  run:worker:
    desc: Worker local
    dir: '{{.WORKER_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      AWS__AccessKey: '{{.AWS_ACCESS_KEY}}'
      AWS__SecretKey: '{{.AWS_SECRET_KEY}}'
      AWS__Region: '{{.AWS_REGION | default "us-east-1"}}'
      AWS__BedrockModelId: '{{.AWS_BEDROCK_MODEL_ID | default "anthropic.claude-3-5-sonnet-20241022-v2:0"}}'
    cmd: dotnet run

  _env:local:
    internal: true
    preconditions:
      - sh: test -f docker/.env.local
        msg: 'Thieu docker/.env.local — copy tu docker/.env.example'
