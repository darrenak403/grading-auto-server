# Taskfile — PRN232 Auto Grader
# Cài Task: https://taskfile.dev/installation/
# Xem lệnh: task  |  task --list-all (kèm task nội bộ)

version: '3'

dotenv: ['.env']

vars:
  COMPOSE_DEV: docker compose -f docker-compose.dev.yml
  COMPOSE_PROD: docker compose -f docker-compose.prod.yml
  SOLUTION: Project.sln
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker
  INFRA_PROJECT: GradingSystem.Infrastructure

tasks:
  default:
    desc: Gợi ý lệnh thường dùng
    silent: true
    cmds:
      - |
        echo "Developer (cần .env + .NET SDK):"
        echo "  task dev:setup   — lần đầu"
        echo "  task dev:up      — hằng ngày: bật DB/RabbitMQ"
        echo "  task dev:api     — terminal 1"
        echo "  task dev:worker  — terminal 2"
        echo "  task dev:down    — tắt infra (giữ data)"
        echo ""
        echo "User / giảng viên (chỉ Docker):"
        echo "  task user:setup  — lần đầu"
        echo "  task user:up     — hằng ngày"
        echo "  task user:down   — tắt stack (giữ data)"
        echo ""
        echo "Chi tiết: RUN_FOR_DEV.md | RUN_FOR_USER.md"

  # ═══════════════════════════════════════════════════════════
  # DEVELOPER — infra Docker + API/Worker chạy trên máy
  # ═══════════════════════════════════════════════════════════

  dev:setup:
    desc: '[Dev] Setup lần đầu (.env có sẵn) — restore, infra, Playwright, migrate'
    cmds:
      - task: _dev:restore
      - mkdir -p storage
      - task: _dev:infra-up
      - task: _dev:infra-wait
      - task: _dev:playwright
      - task: _dev:migrate
      - echo 'Xong. Hằng ngày - task dev:up, dev:api, dev:worker'

  dev:up:
    desc: '[Dev] Hằng ngày — bật Postgres, SQL Server, RabbitMQ'
    cmds:
      - task: _dev:infra-up
      - echo 'Đợi ~1 phút - task dev:api (T1) + task dev:worker (T2)'

  dev:down:
    desc: '[Dev] Tắt infra (giữ dữ liệu DB trong volume)'
    cmds:
      - '{{.COMPOSE_DEV}} stop'

  dev:api:
    desc: '[Dev] Chạy API — http://localhost:5049/swagger'
    dir: '{{.API_DIR}}'
    interactive: true
    cmds:
      - dotnet run

  dev:worker:
    desc: '[Dev] Chạy Worker chấm điểm'
    dir: '{{.WORKER_DIR}}'
    interactive: true
    cmds:
      - dotnet run

  dev:reset:
    desc: '[Dev] Xóa toàn bộ data dev (volume) rồi migrate lại — không cài lại Playwright'
    prompt: Xóa hết database dev và migrate lại?
    cmds:
      - '{{.COMPOSE_DEV}} down -v'
      - task: _dev:infra-up
      - task: _dev:infra-wait
      - task: _dev:migrate

  # ═══════════════════════════════════════════════════════════
  # USER — full stack trong Docker (FE + API + Worker + DB)
  # ═══════════════════════════════════════════════════════════

  user:setup:
    desc: '[User] Setup lần đầu (.env có sẵn) — pull & chạy full stack'
    cmds:
      - task: _user:stack-up
      - echo 'Đợi 2-3 phút - http://localhost:3000'

  user:up:
    desc: '[User] Hằng ngày — bật full stack'
    cmds:
      - task: _user:stack-up
      - echo 'Đợi 1-2 phút - http://localhost:3000'

  user:down:
    desc: '[User] Tắt stack (giữ dữ liệu)'
    cmds:
      - '{{.COMPOSE_PROD}} down'

  # ═══════════════════════════════════════════════════════════
  # Nội bộ (task --list-all)
  # ═══════════════════════════════════════════════════════════

  _dev:restore:
    internal: true
    cmds:
      - dotnet restore {{.SOLUTION}}

  _dev:infra-up:
    internal: true
    cmds:
      - '{{.COMPOSE_DEV}} up -d'

  _dev:infra-wait:
    internal: true
    cmds:
      - |
        echo "Đợi PostgreSQL..."
        for i in $(seq 1 60); do
          if {{.COMPOSE_DEV}} exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-grading_system}" >/dev/null 2>&1; then
            echo "PostgreSQL ready."
            exit 0
          fi
          sleep 2
        done
        echo "PostgreSQL chưa sẵn sàng. Kiểm tra: {{.COMPOSE_DEV}} ps"
        exit 1

  _dev:migrate:
    internal: true
    dir: '{{.API_DIR}}'
    cmds:
      - >-
        dotnet ef database update
        --project ../{{.INFRA_PROJECT}}
        --startup-project .

  _dev:playwright:
    internal: true
    cmds:
      - dotnet tool install --global Microsoft.Playwright.CLI || dotnet tool update --global Microsoft.Playwright.CLI
      - |
        if command -v playwright >/dev/null 2>&1; then
          playwright install chromium
        elif [ -x "$HOME/.dotnet/tools/playwright" ]; then
          "$HOME/.dotnet/tools/playwright" install chromium
        elif [ -f "$USERPROFILE/.dotnet/tools/playwright.cmd" ]; then
          "$USERPROFILE/.dotnet/tools/playwright.cmd" install chromium
        else
          echo "Không tìm thấy playwright CLI sau khi cài tool."
          exit 1
        fi

  _user:stack-up:
    internal: true
    cmds:
      - '{{.COMPOSE_PROD}} pull'
      - '{{.COMPOSE_PROD}} up -d'
