# task --list
version: '3'

dotenv: ['.env']

vars:
  COMPOSE_DEV: docker compose -f docker-compose.dev.yml
  COMPOSE_PROD: docker compose -f docker-compose.prod.yml
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker
  INFRA_PROJECT: GradingSystem.Infrastructure

tasks:
  default:
    desc: Danh sách lệnh
    cmd: task --list
    silent: true

  # Dev — lần đầu
  setup:
    desc: Thiết lập dev lần đầu (env + infra + Playwright + migrate)
    cmds:
      - task: env
      - task: infra:up
      - task: playwright:install
      - task: db:migrate

  # Dev — hằng ngày
  infra:up:
    desc: Bật Postgres, SQL Server, RabbitMQ
    deps: [env]
    cmd: '{{.COMPOSE_DEV}} up -d'

  api:
    desc: Chạy API → http://localhost:5049/swagger
    dir: '{{.API_DIR}}'
    interactive: true
    cmd: dotnet run

  worker:
    desc: Chạy Worker chấm điểm
    dir: '{{.WORKER_DIR}}'
    interactive: true
    cmd: dotnet run

  db:migrate:
    desc: Migrate DB (sau khi pull code mới)
    dir: '{{.API_DIR}}'
    deps: [env]
    cmd: dotnet ef database update --project ../{{.INFRA_PROJECT}} --startup-project .

  playwright:install:
    desc: Cài Playwright + Chromium (chạy lại nếu setup lỗi)
    cmds:
      - dotnet tool install --global Microsoft.Playwright.CLI
      - task: _playwright:build
      - task: _playwright:browsers:unix
      - task: _playwright:browsers:win

  # Người dùng — full Docker, không cần .NET
  prod:up:
    desc: Chạy full stack (FE + API + Worker + DB)
    deps: [env]
    cmd: '{{.COMPOSE_PROD}} up -d'

  prod:down:
    desc: Dừng full stack
    cmd: '{{.COMPOSE_PROD}} down'

  # --- internal ---

  env:
    internal: true
    cmds:
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
    status:
      - test -f .env

  _playwright:build:
    internal: true
    dir: '{{.WORKER_DIR}}'
    cmds:
      - dotnet restore
      - dotnet build -c Debug

  _playwright:browsers:unix:
    internal: true
    dir: '{{.WORKER_DIR}}'
    deps: [_playwright:build]
    platforms: [darwin, linux]
    cmds:
      - |
        set -e
        if [ -f ./bin/Debug/net8.0/playwright.sh ]; then
          ./bin/Debug/net8.0/playwright.sh install chromium
        elif command -v pwsh >/dev/null 2>&1; then
          pwsh -NoProfile -File ./bin/Debug/net8.0/playwright.ps1 install chromium
        else
          playwright install chromium || "$HOME/.dotnet/tools/playwright" install chromium
        fi

  _playwright:browsers:win:
    internal: true
    dir: '{{.WORKER_DIR}}'
    deps: [_playwright:build]
    platforms: [windows]
    cmd: powershell -NoProfile -ExecutionPolicy Bypass -File ./bin/Debug/net8.0/playwright.ps1 install chromium
