# Dev local — https://taskfile.dev/installation/  |  BE.md

version: '3'

vars:
  COMPOSE: docker compose --env-file docker/.env.local -f docker/docker-compose.dev.yml
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker

tasks:
  default:
    desc: Gợi ý lệnh dev
    silent: true
    cmds:
      - task --list
      - |
        echo ""
        echo "Setup lần đầu:"
        echo "  1. cp docker/.env.example docker/.env.local  (rồi điền giá trị)"
        echo "  2. task up"
        echo "  3. task run   (Playwright + API + Worker)"
        echo ""
        echo "Chấm PE câu Razor (cần Playwright):"
        echo "  1. task playwright:up   (bật Chromium CDP, tách riêng khỏi task up)"
        echo "  2. Uncomment Playwright__BrowserCdpEndpoint trong docker/.env.local"
        echo "  3. task worker  (hoặc restart nếu đang chạy)"
        echo "  4. task playwright:down  khi không chấm PE nữa"
        echo ""
        echo "Swagger: http://localhost:5049/swagger"
        echo "pgWeb:   http://localhost:8081"
        echo "Rabbit:  http://localhost:15672"

  up:
    desc: Khởi động infra (Postgres, SQL Server, RabbitMQ, pgWeb)
    deps: [_env]
    cmds:
      - mkdir -p storage
      - '{{.COMPOSE}} up -d --no-build'

  down:
    desc: Tắt infra
    deps: [_env]
    cmd: '{{.COMPOSE}} down'

  clear:
    desc: Xóa toàn bộ dev volumes (Postgres, SQL Server, RabbitMQ) để reset DB từ đầu
    deps: [_env]
    cmd: '{{.COMPOSE}} down -v --remove-orphans'

  playwright:up:
    desc: Khởi động Chromium CDP (cho chấm PE câu Razor) — bật riêng, không nằm trong task up
    deps: [_env]
    cmd: '{{.COMPOSE}} --profile playwright up -d chromium'

  playwright:down:
    desc: Tắt Chromium CDP
    deps: [_env]
    cmd: '{{.COMPOSE}} --profile playwright rm -sf chromium'

  cache:
    desc: Xóa toàn bộ Docker build cache
    cmd: docker builder prune -a -f

  cache:keep:
    desc: Dọn Docker build cache nhưng giữ lại khoảng 3GB cache gần nhất
    cmd: docker builder prune -f --keep-storage 3GB

  logs:
    desc: Xem log infra
    deps: [_env]
    cmd: '{{.COMPOSE}} logs -f --tail=100'

  migrate:
    desc: Chạy EF migration cho Postgres local
    dotenv: ['docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
    cmds:
      - dotnet build GradingSystem.Api/GradingSystem.Api.csproj
      - dotnet ef database update --no-build --project GradingSystem.Infrastructure --startup-project GradingSystem.Api

  run:
    desc: Chạy Playwright, API và Worker
    deps: [_env]
    cmds:
      - task: playwright:up
      - dotnet build Project.sln -m:1
      - task: _apps:run

  api:
    desc: Chạy API — http://localhost:5049/swagger
    dir: '{{.API_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5049
    cmds:
      - dotnet build -m:1
      - task: _api:run

  worker:
    desc: Chạy Worker (grading background service)
    dir: '{{.WORKER_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
    cmds:
      - dotnet build -m:1
      - task: _worker:run

  _api:run:
    internal: true
    dir: '{{.API_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5049
    cmd: dotnet run --no-build --no-restore

  _worker:run:
    internal: true
    dir: '{{.WORKER_DIR}}'
    interactive: true
    dotenv: ['../docker/.env.local']
    env:
      ASPNETCORE_ENVIRONMENT: Development
    cmd: dotnet run --no-build --no-restore

  _apps:run:
    internal: true
    deps: [_api:run, _worker:run]

  _env:
    internal: true
    preconditions:
      - sh: test -f docker/.env.local
        msg: 'Thiếu docker/.env.local — chạy: cp docker/.env.example docker/.env.local'
