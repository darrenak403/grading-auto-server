# https://taskfile.dev/installation/  |  BE.md

version: '3'

vars:
  COMPOSE_DEV: docker compose --env-file docker/.env.local -f docker/docker-compose.dev.yml
  COMPOSE_PROD: docker compose --env-file docker/.env -f docker/docker-compose.prod.yml
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker

tasks:
  default:
    desc: Gợi ý lệnh
    silent: true
    cmds:
      - task --list
      - |
        echo ""
        echo "Docker:  docker/.env.local  ->  docker:build  ->  docker:up"
        echo "Local:   docker:up (DB...)   ->  task run  +  task run:worker (2 terminal)"
        echo "Prod:    docker/.env  ->  task docker:prod:up"
        echo "Doc: BE.md"

  run:
    desc: Chạy API local (dotnet) — http://localhost:5049/swagger
    dir: '{{.API_DIR}}'
    interactive: true
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5049
    cmd: dotnet run

  run:worker:
    desc: Chạy Worker local (dotnet)
    dir: '{{.WORKER_DIR}}'
    interactive: true
    env:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
    cmd: dotnet run

  docker:build:
    desc: Dev — build image API + Worker
    deps: [_docker:require:local]
    cmd: '{{.COMPOSE_DEV}} build api worker'

  docker:up:
    desc: Dev — bật container (compose up -d)
    deps: [_docker:require:local]
    cmds:
      - mkdir -p storage
      - '{{.COMPOSE_DEV}} up -d'
      - |
        echo ""
        echo "API:     http://localhost:5049/swagger"
        echo "Rabbit:  http://localhost:15672"

  docker:down:
    desc: Dev — tắt stack (giữ volume)
    deps: [_docker:require:local]
    cmd: '{{.COMPOSE_DEV}} stop'

  docker:pull:
    desc: Dev — pull image từ registry
    deps: [_docker:require:local]
    cmd: '{{.COMPOSE_DEV}} pull'

  docker:logs:
    desc: Dev — log tất cả service
    deps: [_docker:require:local]
    cmd: '{{.COMPOSE_DEV}} logs -f --tail=100'

  docker:prod:up:
    desc: Prod/VPS — pull + bật stack
    deps: [_docker:require:prod]
    cmds:
      - '{{.COMPOSE_PROD}} pull'
      - '{{.COMPOSE_PROD}} up -d'

  docker:prod:down:
    desc: Prod — tắt stack
    deps: [_docker:require:prod]
    cmd: '{{.COMPOSE_PROD}} stop'

  docker:prod:pull:
    desc: Prod — pull image
    deps: [_docker:require:prod]
    cmd: '{{.COMPOSE_PROD}} pull'

  # --- internal ---

  _docker:require:local:
    internal: true
    preconditions:
      - sh: test -f docker/.env.local
        msg: 'Thieu docker/.env.local — tao tay (tham khao docker/.env.example).'

  _docker:require:prod:
    internal: true
    preconditions:
      - sh: test -f docker/.env
        msg: 'Thieu docker/.env — tao tay (tham khao docker/.env.example).'
