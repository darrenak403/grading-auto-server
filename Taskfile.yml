# Taskfile — PRN232 Auto Grader
# Cài Task: https://taskfile.dev/installation/
# Danh sách lệnh: task --list

version: '3'

dotenv: ['.env']

vars:
  COMPOSE_DEV: docker compose -f docker-compose.dev.yml
  COMPOSE_PROD: docker compose -f docker-compose.prod.yml
  SOLUTION: Project.sln
  API_DIR: GradingSystem.Api
  WORKER_DIR: GradingSystem.Worker
  INFRA_PROJECT: GradingSystem.Infrastructure

tasks:
  default:
    desc: Hiển thị danh sách task
    cmds:
      - task --list
    silent: true

  # --- Setup nhanh (đọc RUN_FOR_DEV.md / RUN_FOR_USER.md) ---

  setup:
    desc: Alias → setup:dev (developer)
    cmds:
      - task: setup:dev

  setup:dev:
    desc: 'Dev lần đầu: restore + Docker infra + Playwright + migrate (cần .env sẵn — RUN_FOR_DEV.md)'
    cmds:
      - task: restore
      - task: storage:init
      - task: infra:up
      - task: infra:wait
      - task: playwright:install
      - task: db:migrate

  setup:user:
    desc: 'User: Docker full stack (cần .env sẵn). Xem RUN_FOR_USER.md'
    cmds:
      - task: prod:up
      - cmd: echo "Đợi 2–3 phút để API/Worker khởi động và migrate DB, rồi mở http://localhost:${FE_PORT:-3000}"

  storage:init:
    desc: Tạo thư mục storage/ (upload local)
    cmds:
      - mkdir -p storage
    status:
      - test -d storage

  # --- Hạ tầng Docker (Development) ---

  infra:up:
    desc: Postgres + SQL Server + RabbitMQ (dev)
    cmds:
      - '{{.COMPOSE_DEV}} up -d'

  infra:wait:
    desc: Đợi PostgreSQL sẵn sàng (trước migrate)
    cmds:
      - |
        echo "Đợi PostgreSQL..."
        for i in $(seq 1 60); do
          if {{.COMPOSE_DEV}} exec -T postgres pg_isready -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-grading_system}" >/dev/null 2>&1; then
            echo "PostgreSQL ready."
            exit 0
          fi
          sleep 2
        done
        echo "PostgreSQL chưa sẵn sàng sau 120s. Kiểm tra: task infra:ps"
        exit 1

  infra:stop:
    desc: Dừng container dev (giữ dữ liệu)
    cmds:
      - '{{.COMPOSE_DEV}} stop'

  infra:down:
    desc: Gỡ container dev (giữ volumes)
    cmds:
      - '{{.COMPOSE_DEV}} down'

  infra:reset:
    desc: Xóa container dev và volumes (reset DB)
    prompt: Bạn có chắc muốn xóa toàn bộ dữ liệu dev?
    cmds:
      - '{{.COMPOSE_DEV}} down -v'

  infra:tools:
    desc: Bật pgWeb (profile tools) — http://localhost:8081
    cmds:
      - '{{.COMPOSE_DEV}} --profile tools up -d'

  infra:logs:
    desc: Log hạ tầng dev
    cmds:
      - '{{.COMPOSE_DEV}} logs -f --tail=100'

  infra:ps:
    desc: Trạng thái container dev
    cmds:
      - '{{.COMPOSE_DEV}} ps'

  # --- Production / User (Docker full stack, không cần dotnet run) ---

  prod:up:
    desc: Pull & chạy full stack (FE, API, Worker, DB) — dùng cho end-user
    cmds:
      - '{{.COMPOSE_PROD}} pull'
      - '{{.COMPOSE_PROD}} up -d'

  prod:build:
    desc: Build image local rồi chạy stack (khi dev image)
    cmds:
      - '{{.COMPOSE_PROD}} up -d --build'

  prod:down:
    desc: Dừng stack production
    cmds:
      - '{{.COMPOSE_PROD}} down'

  prod:logs:
    desc: Log stack production
    cmds:
      - '{{.COMPOSE_PROD}} logs -f --tail=100'

  prod:ps:
    desc: Trạng thái stack production
    cmds:
      - '{{.COMPOSE_PROD}} ps'

  # --- .NET ---

  restore:
    desc: dotnet restore
    cmds:
      - dotnet restore {{.SOLUTION}}

  build:
    desc: Build Debug
    cmds:
      - dotnet build {{.SOLUTION}} -c Debug --no-restore
    deps:
      - restore

  build:release:
    desc: Build Release
    cmds:
      - dotnet build {{.SOLUTION}} -c Release

  clean:
    desc: Xóa bin/obj
    cmds:
      - dotnet clean {{.SOLUTION}}
      - find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} + 2>/dev/null || true

  api:
    desc: Chạy API local — http://localhost:5049/swagger
    dir: '{{.API_DIR}}'
    interactive: true
    cmds:
      - dotnet run

  api:watch:
    desc: API hot reload
    dir: '{{.API_DIR}}'
    interactive: true
    cmds:
      - dotnet watch run

  worker:
    desc: Chạy Worker local (cần infra + Playwright)
    dir: '{{.WORKER_DIR}}'
    interactive: true
    cmds:
      - dotnet run

  worker:watch:
    desc: Worker hot reload
    dir: '{{.WORKER_DIR}}'
    interactive: true
    cmds:
      - dotnet watch run

  # --- Database ---

  db:migrate:
    desc: EF migrate PostgreSQL
    dir: '{{.API_DIR}}'
    cmds:
      - >-
        dotnet ef database update
        --project ../{{.INFRA_PROJECT}}
        --startup-project .

  db:migration:add:
    desc: 'Migration mới: task db:migration:add NAME=TenMigration'
    dir: '{{.API_DIR}}'
    cmds:
      - >-
        dotnet ef migrations add {{.NAME}}
        --project ../{{.INFRA_PROJECT}}
        --startup-project .
        --output-dir Persistence/Migrations
    preconditions:
      - sh: test -n "{{.NAME}}"
        msg: 'Thiếu NAME. Ví dụ: task db:migration:add NAME=AddFoo'

  db:migration:remove:
    desc: Xóa migration cuối
    dir: '{{.API_DIR}}'
    cmds:
      - >-
        dotnet ef migrations remove
        --project ../{{.INFRA_PROJECT}}
        --startup-project .

  # --- Playwright ---

  playwright:install-cli:
    desc: Cài/cập nhật Playwright CLI global
    cmds:
      - dotnet tool install --global Microsoft.Playwright.CLI || dotnet tool update --global Microsoft.Playwright.CLI

  playwright:install-browsers:
    desc: Tải Chromium
    cmds:
      - |
        if command -v playwright >/dev/null 2>&1; then
          playwright install chromium
        elif [ -x "$HOME/.dotnet/tools/playwright" ]; then
          "$HOME/.dotnet/tools/playwright" install chromium
        elif [ -f "$USERPROFILE/.dotnet/tools/playwright.cmd" ]; then
          "$USERPROFILE/.dotnet/tools/playwright.cmd" install chromium
        else
          echo "Chưa có playwright CLI → task playwright:install-cli"
          exit 1
        fi

  playwright:install:
    desc: CLI + Chromium (bắt buộc cho Worker dev)
    cmds:
      - task: playwright:install-cli
      - task: playwright:install-browsers

  # --- Build image local ---

  docker:build:api:
    desc: Build image API
    cmds:
      - docker build -f {{.API_DIR}}/Dockerfile -t grading-system-api:local .

  docker:build:worker:
    desc: Build image Worker
    cmds:
      - docker build -f {{.WORKER_DIR}}/Dockerfile -t grading-system-worker:local .

  docker:build:
    desc: Build image API + Worker
    cmds:
      - task: docker:build:api
      - task: docker:build:worker
