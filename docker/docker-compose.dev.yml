# Dev — env: docker/.env.local
#   task docker:up        → infra (không build)
#   task docker:build     → build image api + worker (profile app)
#   task run / run:worker → app local (dotnet)

services:
  postgres:
    image: postgres:17.5-alpine3.22
    container_name: grading-dev-postgres
    restart: unless-stopped
    networks:
      - grading-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    container_name: grading-dev-pgweb
    restart: unless-stopped
    networks:
      - grading-network
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
    ports:
      - '${PGWEB_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grading-dev-sqlserver
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - grading-network
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - '${SQLSERVER_PUBLISH_PORT:-1433}:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C -b",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: grading-dev-rabbitmq
    restart: unless-stopped
    networks:
      - grading-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672'
      - '${RABBITMQ_UI_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: GradingSystem.Api/Dockerfile
    image: ${DOCKER_REPO}/grading-system-api:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: grading-dev-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-5049}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      Storage__BasePath: /storage
      RabbitMQ__Host: rabbitmq://rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1}
    volumes:
      - ../storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grading-network

  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: GradingSystem.Worker/Dockerfile
    image: ${DOCKER_REPO}/grading-system-worker:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: grading-dev-worker
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}'
      ConnectionStrings__SqlServer: 'Server=sqlserver,1433;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true'
      Storage__BasePath: /storage
      RabbitMQ__Host: rabbitmq://rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Worker__MaxConcurrentJobs: ${WORKER_MAX_CONCURRENT_JOBS:-3}
      Worker__PollIntervalSeconds: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      Worker__ArtifactHealthCheckTimeoutSeconds: ${WORKER_ARTIFACT_HEALTH_TIMEOUT_SECONDS:-30}
      Worker__ArtifactPortRangeStart: ${WORKER_ARTIFACT_PORT_RANGE_START:-7000}
      Worker__ArtifactPortRangeEnd: ${WORKER_ARTIFACT_PORT_RANGE_END:-7999}
      Worker__BindHost: ${WORKER_BIND_HOST:-127.0.0.1}
      Worker__NewmanExecutable: ${WORKER_NEWMAN_EXECUTABLE:-}
    volumes:
      - ../storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - grading-network

volumes:
  pgdata:
  sqlserver-data:
  rabbitmq-data:

networks:
  grading-network:
    driver: bridge
