# CI: build & push API + Worker images to Docker Hub.
# CD: Dokploy trên VPS pull image và deploy (không qua GitHub Actions).

name: CI — Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: Build cả API và Worker (bỏ qua path filter)
        type: boolean
        default: true

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ secrets.DOCKER_USERNAME }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'GradingSystem.Api/**'
              - 'GradingSystem.Api/Dockerfile'
              - 'GradingSystem.Application/**'
              - 'GradingSystem.Domain/**'
              - 'GradingSystem.Infrastructure/**'
              - 'Project.sln'
              - 'GradingSystem.slnx'
              - '.github/workflows/ci-docker.yml'
            worker:
              - 'GradingSystem.Worker/**'
              - 'GradingSystem.Worker/Dockerfile'
              - 'GradingSystem.Application/**'
              - 'GradingSystem.Domain/**'
              - 'GradingSystem.Infrastructure/**'
              - 'Project.sln'
              - 'GradingSystem.slnx'
              - '.github/workflows/ci-docker.yml'

  build-api:
    name: Build & push API
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.api == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_all)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: GradingSystem.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/grading-system-api:latest
            ${{ env.REGISTRY }}/grading-system-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-worker:
    name: Build & push Worker
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.worker == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force_all)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: GradingSystem.Worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/grading-system-worker:latest
            ${{ env.REGISTRY }}/grading-system-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  summary:
    name: Summary
    needs: [changes, build-api, build-worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## CI — Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Path changed | Job |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| grading-system-api | ${{ needs.changes.outputs.api }} | ${{ needs.build-api.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| grading-system-worker | ${{ needs.changes.outputs.worker }} | ${{ needs.build-worker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags: \`:latest\`, \`:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy VPS: **Dokploy** pull từ Docker Hub (không deploy trong workflow này)." >> "$GITHUB_STEP_SUMMARY"
