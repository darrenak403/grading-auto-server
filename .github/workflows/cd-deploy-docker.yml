name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build-push
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'GradingSystem.Api/**'
              - 'GradingSystem.Application/**'
              - 'GradingSystem.Domain/**'
              - 'GradingSystem.Infrastructure/**'
              - 'GradingSystem.slnx'
            worker:
              - 'GradingSystem.Worker/**'
              - 'GradingSystem.Application/**'
              - 'GradingSystem.Domain/**'
              - 'GradingSystem.Infrastructure/**'
              - 'GradingSystem.slnx'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        if: steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./GradingSystem.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/grading-system-api:latest
            ${{ secrets.DOCKER_USERNAME }}/grading-system-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        if: steps.changes.outputs.worker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./GradingSystem.Worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/grading-system-worker:latest
            ${{ secrets.DOCKER_USERNAME }}/grading-system-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
